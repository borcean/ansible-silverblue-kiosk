---
- name: restart_sshd
  service:
    name: "{{ openssh_service }}"
    state: restarted

- name: rpm-ostree_reload
  ansible.builtin.command: rpm-ostree reload

- name: systemd_daemon_reload
  ansible.builtin.systemd:
    daemon_reload: true

- name: dconf_db_update
  ansible.builtin.command: dconf update
  changed_when: true
